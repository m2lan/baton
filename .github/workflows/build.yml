name: Build

# 三平台各自在自己的 runner 上构建：
#   - macOS 的 dmg 只能在 macOS 上做（hdiutil + 签名/公证）
#   - node-pty 是平台相关的预编译二进制，npm 只装当前平台的，跨平台构建会缺
# 所以这里用矩阵，一个平台一个 job，各自 npm ci 拿到正确的原生模块。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 只构建不上传 Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响其它平台继续出包
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: win
            arch: x64
            artifact: release/*.exe
          - name: macos-arm64
            os: macos-latest
            platform: mac
            arch: arm64
            artifact: release/*.dmg
          - name: macos-x64
            # GitHub 正在逐步下线 Intel runner；若该 job 报 unavailable，
            # 删掉这一行改用 macos-latest + --arch=x64（需先装 darwin-x64 的 node-pty）
            os: macos-13
            platform: mac
            arch: x64
            artifact: release/*.dmg
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: release/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        env:
          # 不配签名证书时 electron-builder 会自动跳过签名
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS 公证（可选）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 直连 GitHub，不走国内镜像
          LOCALBOT_OFFICIAL_MIRROR: '1'
        run: node scripts/dist.js --${{ matrix.platform }} --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: localbot-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.draft != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: 汇总产物
        run: |
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' \) \
            -exec cp {} out/ \;
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
